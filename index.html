<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!--
      lang, title and description are the default locale (es): the fallback shown before JavaScript runs.
      At runtime the app sets lang, title and description from the active locale and copies the theme's
      --color-bg-canvas into theme-color. These static values equal the default locale texts and the light
      tokens of src/styles/tokens.css; src/config/config.test.ts keeps them equal.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sal a caminar: Trino reconoce las aves por su canto en tu teléfono, sin conexión, y las deja en tu mapa y en tu álbum." />
    <meta name="theme-color" content="#EDF1EE" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Trino — Reconoce las aves por su canto</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
