name: Continuous integration

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['main']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Types, lint, tests and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests and coverage
        run: npm run test:coverage

      # prepare-offline.mjs rejects missing shell resources, including index.html, so building verifies the artifact.
      - name: Build the application
        run: npm run build

  account-e2e:
    name: Account and offline integrity E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgis/postgis@sha256:94146ac37bc61e2322f88016056c5920729cb8c64c8542ed590af8fc2abdac07
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55434:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: frontend
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Jacklb19/Bird_Back
          ref: b9f627c0938e23899a31deab9474ac2871daa2d1
          path: backend
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare the local API
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
          .venv/bin/python tests/prepare_database.py
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run browser tests with local accounts
        working-directory: frontend
        run: |
          npm ci
          npm run build:e2e
          node scripts/prepare-offline-check.mjs
          npx --no-install playwright install --with-deps chromium
          npx --no-install playwright test e2e/account.spec.ts
          npx --no-install playwright test e2e/beta.spec.ts --grep-invert "real browser decoder"
          npx --no-install playwright test e2e/offline.spec.ts --grep "500 detections|response loss|a walk goes|a note goes|service worker finishes|deleting an account|large local history|unassociated records"
