name: Integración Continua

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['main']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verificación (Tipos, Lint, Pruebas y Build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis@sha256:94146ac37bc61e2322f88016056c5920729cb8c64c8542ed590af8fc2abdac07
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55434:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Verify backend and local migrations
        env:
          BIRDNET_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:55434/birdnet_s4_test
        run: |
          python backend/tests/prepare_database.py
          python -m pytest backend -q

      - name: Verificación de tipos estáticos
        run: npm run typecheck

      - name: Análisis estático (Lint)
        run: npm run lint

      - name: Pruebas unitarias y cobertura
        run: npm run test:coverage

      - name: Construcción de la aplicación
        run: npm run build

      - name: Verificar artefacto de construcción
        run: test -f dist/index.html
